# Reglas operativas de la red.
# La semana empieza el lunes indicado (00:00 UTC) y dura 168 h. La operación es
# cíclica: cada avión debe terminar la semana donde pueda comenzar la siguiente.

week_start: '2026-03-02'
hub: MIA

# Cada avión está pre-asignado a un operador y no cambia durante la semana.
operators:
  AND: 'Andina Cargo'
  BRA: 'Brasil Cargo'
  PAC: 'Pacífico Cargo'
  SUR: 'Austral Cargo'

# Tiempo mínimo en tierra entre dos vuelos consecutivos del mismo avión, según
# la carga que haya que mover: 50 min si solo se reabastece combustible,
# 90 min si llega lleno y sale lleno, 70 min en el resto de los casos.
tat_minutes:
  default: 70
  technical_stop: 50
  full_in_full_out: 90

# Escalas técnicas: el avión solo se reabastece, no carga ni descarga.
technical_stop_airports:
  - PTY
  - SID

# Combustible y carga compiten por el peso máximo de despegue: a plena carga
# solo caben max_fuel_at_max_payload_gal, que descontando la reserva alcanzan
# para max_continuous_block_hours de vuelo.
fuel_capacity:
  tank_capacity_gal: 19100.0
  max_fuel_at_max_payload_gal: 9800.0
  reserve_hours: 1.5

# Duración máxima de un tramo, en horas (no es un límite diario ni semanal).
max_continuous_block_hours: 9.0

# Toneladas mínimas que debe mover una escala adicional para justificarse.
# Un vuelo ferry (posicionamiento vacío, 0 t) queda exento.
min_tons_per_extra_stop: 10
