<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de resultados</title>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-blur: blur(20px) saturate(180%);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.1);
            --accent: #007aff;
            --plane-default: #6e6e73;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text-main); background: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }

        .glass { background: var(--bg-glass); backdrop-filter: var(--bg-blur); -webkit-backdrop-filter: var(--bg-blur); border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--shadow-sm); }

        /* ================= VISTA MAPA ================= */
        #map-view { display: flex; flex-direction: column; width: 100vw; min-height: 100vh; }

        #map-section { position: relative; width: 100%; height: 70vh; min-height: 500px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #map { position: absolute; inset: 0; z-index: 1; }
        #canvas-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

        /* Controles Superiores Flotantes */
        .map-top-left { position: absolute; top: 24px; left: 24px; z-index: 10; display: flex; align-items: center; gap: 12px; }
        .map-top-right { position: absolute; top: 24px; right: 24px; z-index: 10; display: flex; gap: 12px; align-items: flex-start; }
        
        .map-top-btn { padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); color: var(--text-main); }
        .map-top-btn:hover { background: rgba(255,255,255,0.95); }

        /* Timeline */
        .timeline-glass { border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; height: 45px; border: 1px solid var(--border); }
        .play-btn { width: 28px; height: 28px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 11px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; padding-left: 2px; }
        .play-btn.paused { padding-left: 0; }
        .play-btn:hover { transform: scale(1.05); }
        .speed-btn { background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; min-width: 24px; }
        input[type="range"] { accent-color: var(--accent); height: 4px; cursor: pointer; width: 120px; }
        .time-display { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; color: var(--text-main); min-width: 80px; text-align: right; }

        /* Ventana Emergente de Filtros */
        .filters-popup { position: absolute; top: 60px; right: 0; z-index: 10; width: 320px; padding: 24px; border-radius: 20px; display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.2s ease; margin-top: 10px; }
        .filters-popup.active { display: flex; }
        .filters-popup h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); background: #fff; font-family: inherit; font-size: 13px; font-weight: 500; outline: none; transition: 0.2s; cursor: pointer; }
        select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        .btn-clear { padding: 10px; background: rgba(0,0,0,0.05); border: none; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-clear:hover { background: rgba(0,0,0,0.08); }

        /* Tooltip */
        .tooltip { position: absolute; z-index: 100; pointer-events: none; display: none; padding: 16px; border-radius: 16px; font-size: 13px; min-width: 260px; transform: translate(-50%, -120%); }
        .tt-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; letter-spacing: -0.3px; }
        .tt-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .tt-row span:first-child { color: var(--text-muted); font-weight: 500; }
        .tt-row span:last-child { font-weight: 600; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* Dashboard Inferior */
        #dashboard-section { max-width: 1200px; margin: 0 auto; padding: 40px 24px; width: 100%; flex: 1; }

        /* Tabs Clásicas */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; gap: 32px; overflow-x: auto; padding-bottom: 1px; }
        .tab-btn { padding: 12px 4px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: 0.2s; margin-bottom: -1px; white-space: nowrap; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Listas / Tablas */
        .list-header { font-size: 12px; font-weight: 600; color: var(--text-muted); display: grid; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; }
        .list-row { display: grid; gap: 16px; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 500; transition: background 0.15s; }
        .list-row:last-child { border-bottom: none; }
        .list-row:hover { background: #f5f5f7; border-radius: 12px; }
        
        .grid-fids { grid-template-columns: 1fr 2fr 1fr; }
        .grid-apts { grid-template-columns: 2fr 1fr 1fr; }
        .grid-carg { grid-template-columns: 2fr 1.5fr 3fr; }

        .cargo-bar-wrapper { height: 6px; background: rgba(0,0,0,0.06); border-radius: 3px; overflow: hidden; width: 100%; align-self: center; }
        .cargo-bar-fill { height: 100%; border-radius: 3px; transition: 0.3s; }

        .loading { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 500; color: var(--text-muted); text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- SPINNER -->
    <div id="loading" class="loading">Cargando visualizador...</div>

    <!-- ================= VISTA MAPA (Única Pantalla) ================= -->
    <div id="map-view">
        <!-- Mapa Superior -->
        <div id="map-section">

            <!-- Controles (Arriba Derecha) -->
            <div class="map-top-right">
                
                <!-- Timeline Control Integrado Arriba -->
                <div class="timeline-glass glass">
                    <button id="btn-play" class="play-btn">▶</button>
                    <button id="btn-speed" class="speed-btn">1x</button>
                    <input type="range" id="slider" min="0" max="168" step="0.1" value="0">
                    <div class="time-display" id="time-display">Lun 00:00</div>
                </div>

                <!-- Botón Filtros y Popup Relativo -->
                <div style="position:relative">
                    <button class="map-top-btn glass" id="btn-toggle-filters" style="height:45px;">Filtros</button>
                    
                    <div class="filters-popup glass" id="filters-popup">
                        <h3>Filtrar Visualización</h3>
                        <div class="filter-group">
                            <label>Operador</label>
                            <select id="f-op"><option value="ALL">Todos</option></select>
                        </div>
                        <div class="filter-group">
                            <label>Nivel de Carga</label>
                            <select id="f-carga">
                                <option value="ALL">Cualquiera</option>
                                <option value="HIGH">Alta (>70%)</option>
                                <option value="MED">Media (40-70%)</option>
                                <option value="LOW">Baja (<40%)</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Origen</label>
                            <select id="f-origen"><option value="ALL">Todos</option></select>
                        </div>
                        <div class="filter-group">
                            <label>Destino</label>
                            <select id="f-destino"><option value="ALL">Todos</option></select>
                        </div>
                        <div class="filter-group">
                            <label>Ruta Específica</label>
                            <select id="f-ruta"><option value="ALL">Todas las rutas</option></select>
                        </div>
                        <button class="btn-clear" id="btn-clear-filters">Borrar filtros</button>
                    </div>
                </div>
            </div>

            <div id="map"></div>
            <canvas id="canvas-layer"></canvas>
            <div id="tooltip" class="tooltip glass"></div>
        </div>

        <!-- Dashboard Inferior -->
        <div id="dashboard-section">
            <div class="tabs">
                <button class="tab-btn active" data-tab="fids">Directorio de Vuelos</button>
                <button class="tab-btn" data-tab="airports">Transferencias por Aeropuerto</button>
                <button class="tab-btn" data-tab="cargo">Cumplimiento de Carga</button>
            </div>

            <div class="tab-content active" id="tab-fids">
                <div class="list-header grid-fids"><span>Vuelo / Aeronave</span><span>Ruta Origen → Destino</span><span style="text-align:right">Progreso de Vuelo</span></div>
                <div id="fids-body"></div>
            </div>
            
            <div class="tab-content" id="tab-airports">
                <div class="list-header grid-apts"><span>Aeropuerto</span><span style="text-align:right">Carga Enviada</span><span style="text-align:right">Carga Recibida</span></div>
                <div id="airports-body"></div>
            </div>

            <div class="tab-content" id="tab-cargo">
                <div class="list-header grid-carg"><span>Ruta</span><span style="text-align:right">Servida / Demanda</span><span>Progreso de Satisfacción</span></div>
                <div id="cargo-body"></div>
            </div>
        </div>
    </div>

<script>
window.onerror = function(msg, url, line, col, error) {
    console.error(`Error crítico: ${msg} en Línea: ${line}`);
};

// ================= LÓGICA DEL MAPA =================
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const SPEEDS = [1, 2, 5, 10, 20];
const FMT_USD = v => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
const FMT_NUM = v => new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(v);

let D, map, canvas, ctx;
let t = 0, playing = false, speed = 1, lastTs = 0;
let apDict = {}, airportStats = {};

const COLORS = { 'AND':'#007aff', 'SUR':'#34c759', 'BRA':'#ff9500', 'PAC':'#ff3b30' };
const PLANE_PATH = new Path2D("M21,16 L21,14 L13,9 L13,3.5 C13,2.67 12.33,2 11.5,2 C10.67,2 10,2.67 10,3.5 L10,9 L2,14 L2,16 L10,13.5 L10,19 L8,20.5 L8,22 L11.5,21 L15,22 L15,20.5 L13,19 L13,13.5 Z");

function getRouteColor(ratio) {
    if (ratio < 0.4) return 'rgba(142,142,147,0.55)';
    if (ratio < 0.7) return 'rgba(52,199,89,0.7)';
    return 'rgba(255,59,48,0.7)';
}

function slerp(lat1, lon1, lat2, lon2, f) {
    const R=Math.PI/180, p1=lat1*R, l1=lon1*R, p2=lat2*R, l2=lon2*R;
    const dp=p2-p1, dl=l2-l1;
    const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    if(c<1e-6) return [lon1,lat1];
    const A=Math.sin((1-f)*c)/Math.sin(c), B=Math.sin(f*c)/Math.sin(c);
    const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
    const y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
    const z=A*Math.sin(p1)+B*Math.sin(p2);
    return [Math.atan2(y,x)/R, Math.atan2(z,Math.sqrt(x*x+y*y))/R];
}

function getHeading(lat1, lon1, lat2, lon2, f) {
    const [a1, b1] = slerp(lat1, lon1, lat2, lon2, Math.max(0, f-0.001));
    const [a2, b2] = slerp(lat1, lon1, lat2, lon2, Math.min(1, f+0.001));
    const p1 = map.project([a1, b1]), p2 = map.project([a2, b2]);
    return Math.atan2(p2.y - p1.y, p2.x - p1.x);
}

function getProgress(v) {
    if(v.hora_salida <= v.hora_llegada) {
        if(t >= v.hora_salida && t <= v.hora_llegada) return (t-v.hora_salida)/(v.hora_llegada-v.hora_salida);
    } else {
        const dur = (168-v.hora_salida) + v.hora_llegada;
        if(t >= v.hora_salida) return (t-v.hora_salida)/dur;
        if(t <= v.hora_llegada) return (t+168-v.hora_salida)/dur;
    }
    return -1;
}

function isMatch(v, ratio) {
    const op = document.getElementById('f-op').value;
    const rt = document.getElementById('f-ruta').value;
    const ori = document.getElementById('f-origen').value;
    const des = document.getElementById('f-destino').value;
    const cg = document.getElementById('f-carga').value;
    
    if (op !== 'ALL' && v.operador !== op) return false;
    if (rt !== 'ALL' && `${v.origen}-${v.destino}` !== rt) return false;
    if (ori !== 'ALL' && v.origen !== ori) return false;
    if (des !== 'ALL' && v.destino !== des) return false;
    if (cg !== 'ALL') {
        if (cg === 'HIGH' && ratio < 0.7) return false;
        if (cg === 'MED' && (ratio < 0.4 || ratio >= 0.7)) return false;
        if (cg === 'LOW' && ratio >= 0.4) return false;
    }
    return true;
}

async function initMap() {
    try { 
        // Agregamos un timestamp (cache buster) para asegurar que siempre traiga los datos nuevos
        const r = await fetch('../data/resources/resultados.json?_t=' + new Date().getTime()); 
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        D = await r.json(); 
    } 
    catch(e) { 
        console.error('Error cargando datos: ' + e.message); 
        return; 
    }

    const oriSet = new Set(), desSet = new Set();
    D.aeropuertos.forEach(a => { apDict[a.iata] = a; airportStats[a.iata] = { out: 0, in: 0 }; });

    const ops = new Set(D.vuelos.map(v => v.operador));
    const rts = new Set(D.vuelos.map(v => `${v.origen}-${v.destino}`));
    
    D.vuelos.forEach(v => {
        oriSet.add(v.origen); desSet.add(v.destino);
        if(airportStats[v.origen]) airportStats[v.origen].out += v.carga_tons;
        if(airportStats[v.destino]) airportStats[v.destino].in += v.carga_tons;
    });

    const pop = (sel, set, mapFn = x=>x) => Array.from(set).sort().forEach(i => document.getElementById(sel).insertAdjacentHTML('beforeend', `<option value="${i}">${mapFn(i)}</option>`));
    pop('f-op', ops); pop('f-ruta', rts, x => x.replace('-',' → ')); pop('f-origen', oriSet); pop('f-destino', desSet);

    map = new maplibregl.Map({ 
        container: 'map', 
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', 
        center: [-60, -15], zoom: 3, dragRotate: false 
    });

    map.on('load', () => {
        try {
            map.setPaintProperty('background', 'background-color', '#e2efe6'); 
            map.setPaintProperty('water', 'fill-color', '#ffffff');
            
            map.setPaintProperty('boundary_country_inner', 'line-color', '#9eb0a4');
            map.setPaintProperty('boundary_country_inner', 'line-opacity', 0.8);
            map.setPaintProperty('boundary_country_outline', 'line-color', '#ffffff');
        } catch(e) { console.warn("No se pudo modificar la paleta", e); }

        setupCanvas(); setupUIEvents(); populateStaticTabs();

        document.getElementById('loading').style.display = 'none';
        
        // Forzar resize para evitar glitch de canvas
        setTimeout(() => map.resize(), 600);
        
        requestAnimationFrame(loop);
        map.on('render', render); map.on('move', render); map.on('zoom', render);
    });
}

function setupCanvas() {
    canvas = document.getElementById('canvas-layer'); ctx = canvas.getContext('2d');
    const resize = () => { 
        const rect = document.getElementById('map-section').getBoundingClientRect();
        canvas.width = rect.width; canvas.height = rect.height; render(); 
    };
    window.addEventListener('resize', resize); resize();
}

function render() {
    if(!ctx || !D) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    window._drawnFlights = [];
    const fOp = document.getElementById('f-op').value; 

    D.rutas_catalogo.forEach(r => {
        const o = apDict[r.origen], d = apDict[r.destino];
        if(o && d) drawArc(o.lon, o.lat, d.lon, d.lat, 'rgba(0,0,0,0.025)', 1, 20);
    });

    D.vuelos.forEach(v => {
        const p = getProgress(v);
        if(p < 0) return;

        const cap = D.flota.find(f => f.aircraft_id === v.aeronave)?.payload_tons || 50;
        const ratio = v.carga_tons / cap;
        if(!isMatch(v, ratio)) return;

        const o = apDict[v.origen], d = apDict[v.destino];
        if(!o || !d) return;

        drawArc(o.lon, o.lat, d.lon, d.lat, getRouteColor(ratio), 2.5, 30);

        const [clon, clat] = slerp(o.lat, o.lon, d.lat, d.lon, p);
        const pt = map.project([clon, clat]);
        const angle = getHeading(o.lat, o.lon, d.lat, d.lon, p);

        const isColored = (fOp !== 'ALL' && v.operador === fOp);
        const planeColor = isColored ? COLORS[v.operador] : 'var(--plane-default)';

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(angle + Math.PI/2);
        ctx.scale(0.85, 0.85);
        ctx.translate(-11.5, -12);
        
        ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#fff';
        ctx.stroke(PLANE_PATH);
        
        ctx.fillStyle = planeColor;
        ctx.fill(PLANE_PATH);
        ctx.restore();

        window._drawnFlights.push({v, pt, p, ratio, isColored});
    });

    D.aeropuertos.forEach(a => {
        const pt = map.project([a.lon, a.lat]);
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.stroke();
        ctx.font = '600 10px Inter'; ctx.fillStyle = '#1d1d1f';
        ctx.textAlign = 'center'; ctx.fillText(a.iata, pt.x, pt.y - 7);
    });

    updateFIDS();
}

function drawArc(lon1, lat1, lon2, lat2, color, width, segs) {
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    for(let i=0; i<=segs; i++) {
        const [l, p] = slerp(lat1, lon1, lat2, lon2, i/segs);
        const pt = map.project([l, p]);
        i===0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
}

function updateFIDS() {
    const list = window._drawnFlights || [];
    const container = document.getElementById('fids-body');
    if(!list.length) { container.innerHTML = '<div class="list-row" style="text-align:center;color:var(--text-muted)">Sin vuelos activos en este momento</div>'; return; }
    
    container.innerHTML = list.map(f => {
        const pct = Math.round(f.p * 100);
        const col = f.isColored ? COLORS[f.v.operador] : 'var(--plane-default)';
        return `
        <div class="list-row grid-fids">
            <span><span class="dot" style="background:${col}"></span>${f.v.aeronave}</span>
            <span>${f.v.origen} → ${f.v.destino}</span>
            <span style="text-align:right; color:var(--text-muted)">${pct}%</span>
        </div>`;
    }).join('');
}

function populateStaticTabs() {
    const aptTab = document.getElementById('airports-body');
    const apts = D.aeropuertos.filter(a => airportStats[a.iata].out > 0 || airportStats[a.iata].in > 0)
        .sort((a,b) => (airportStats[b.iata].out + airportStats[b.iata].in) - (airportStats[a.iata].out + airportStats[a.iata].in));
    
    aptTab.innerHTML = apts.map(a => {
        const s = airportStats[a.iata];
        return `
        <div class="list-row grid-apts">
            <span><strong>${a.iata}</strong> <span style="font-size:12px;color:var(--text-muted)">(${a.pais})</span></span>
            <span style="text-align:right;">${FMT_NUM(s.out)} t</span>
            <span style="text-align:right;">${FMT_NUM(s.in)} t</span>
        </div>`;
    }).join('');

    const cgTab = document.getElementById('cargo-body');
    cgTab.innerHTML = D.demanda_servida.map(d => {
        const pct = Math.min(100, (d.toneladas_servidas / d.toneladas_disponibles) * 100);
        return `
        <div class="list-row grid-carg">
            <span>${d.origen} → ${d.destino}</span>
            <span style="text-align:right">${FMT_NUM(d.toneladas_servidas)} / ${FMT_NUM(d.toneladas_disponibles)} t</span>
            <div class="cargo-bar-wrapper"><div class="cargo-bar-fill" style="width:${pct}%; background:var(--accent)"></div></div>
        </div>`;
    }).join('');
}

function loop(ts) {
    if(!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    if(playing) {
        t += (dt / 2000) * speed;
        if(t > 168) t = 0;
        updateTimeUI(); render();
    }
    lastTs = ts;
    requestAnimationFrame(loop);
}

function updateTimeUI() {
    document.getElementById('slider').value = t;
    const di = Math.min(Math.floor(t / 24), 6), h = Math.floor(t % 24), m = Math.floor((t % 1) * 60);
    document.getElementById('time-display').textContent = `${DIAS[di]} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function setupUIEvents() {
    const bp = document.getElementById('btn-play');
    bp.onclick = () => { 
        playing = !playing; 
        bp.textContent = playing ? '⏸' : '▶'; 
        playing ? bp.classList.add('paused') : bp.classList.remove('paused');
    };
    
    const bs = document.getElementById('btn-speed');
    bs.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; bs.textContent = speed+'x'; };
    
    document.getElementById('slider').oninput = e => { t = parseFloat(e.target.value); updateTimeUI(); render(); };

    // Toggle ventana de filtros superior derecha
    const popup = document.getElementById('filters-popup');
    document.getElementById('btn-toggle-filters').onclick = () => {
        popup.classList.toggle('active');
    };

    ['f-op', 'f-ruta', 'f-origen', 'f-destino', 'f-carga'].forEach(id => {
        document.getElementById(id).onchange = render;
    });

    document.getElementById('btn-clear-filters').onclick = () => {
        ['f-op', 'f-ruta', 'f-origen', 'f-destino', 'f-carga'].forEach(id => document.getElementById(id).value = 'ALL');
        render();
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        };
    });

    const tt = document.getElementById('tooltip');
    document.getElementById('map-section').addEventListener('mousemove', e => {
        let found = null;
        if (window._drawnFlights) {
            for (let f of window._drawnFlights) {
                if (Math.hypot(f.pt.x - e.clientX, f.pt.y - e.clientY) < 16) { found = f; break; }
            }
        }
        if (found) {
            const v = found.v;
            const pct = Math.round(found.p * 100);
            tt.style.display = 'block';
            tt.style.left = (e.clientX + 15) + 'px';
            tt.style.top = (e.clientY - 15) + 'px';
            
            const fOp = document.getElementById('f-op').value;
            const isColored = (fOp !== 'ALL' && v.operador === fOp);
            const dispCol = isColored ? COLORS[v.operador] : 'var(--text-main)';

            tt.innerHTML = `
                <div class="tt-title"><span class="dot" style="background:${dispCol}; width:10px; height:10px;"></span> ${v.aeronave} <span style="color:var(--text-muted);font-weight:500;margin-left:4px">(${v.operador})</span></div>
                <div class="tt-row"><span>Ruta</span><span>${v.origen} → ${v.destino}</span></div>
                <div class="tt-row"><span>Carga</span><span>${FMT_NUM(v.carga_tons)} t</span></div>
                <div class="tt-row"><span>Costo</span><span>${FMT_USD(v.costo_operacion)}</span></div>
                <div class="cargo-bar-wrapper" style="margin-top:12px;height:4px;background:rgba(0,0,0,0.1)"><div class="cargo-bar-fill" style="width:${pct}%;background:${dispCol}"></div></div>
            `;
        } else {
            tt.style.display = 'none';
        }
    });
    
    document.getElementById('map-section').addEventListener('mouseleave', () => { tt.style.display = 'none'; });
}

// Iniciar mapa automáticamente al cargar
window.onload = initMap;
</script>
</body>
</html>
