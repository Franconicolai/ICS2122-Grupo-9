<html lang="es">
<head>

    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-glass: rgba(255, 255, 255, 0.35);
            --bg-blur: blur(40px) saturate(200%);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border: rgba(255, 255, 255, 0.3);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --accent: #007aff;

        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text-main); background: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }

        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%); border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

        /* ================= VISTA MAPA ================= */
        #map-view { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        #map-section { position: relative; width: 100%; height: 100vh; flex-shrink: 0; }
        #map { position: absolute; inset: 0; z-index: 1; }
        #canvas-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

        /* Controles Flotantes */
        .map-top-left { position: absolute; top: 24px; left: 24px; z-index: 10; display: flex; align-items: flex-start; gap: 12px; }
        .map-top-right { position: absolute; top: 24px; right: 24px; z-index: 10; display: flex; gap: 12px; align-items: flex-start; }
        .map-bottom-right { position: absolute; bottom: 24px; right: 24px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        
        .map-top-btn { padding: 0 16px; height: 45px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-main); max-width: 200px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; appearance: none; -webkit-appearance: none; font-family: inherit; }

<script>
window.onerror = function(msg, url, line, col, error) {
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'position:fixed;top:0;left:0;z-index:999999;background:red;color:white;padding:20px;font-family:monospace;width:100%;';
    errDiv.innerHTML = `<strong>Error crítico JS:</strong> ${msg} (Línea: ${line})<br><pre>${error ? error.stack : ''}</pre>`;
    document.body.appendChild(errDiv);
    console.error(`Error crítico: ${msg} en Línea: ${line}`);
};

// ================= LÓGICA DEL MAPA =================
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const SPEEDS = [1, 2, 5, 10, 20];
const FMT_USD = v => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
const FMT_NUM = v => new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(v);

let D, map, canvas, ctx;
let t = 0, playing = false, speed = 1, lastTs = 0;
let apDict = {}, airportStats = {};

const COLORS = { 'AND':'#007aff', 'SUR':'#34c759', 'BRA':'#ff9500', 'PAC':'#ff3b30' };
const PLANE_PATH = new Path2D("M21,16 L21,14 L13,9 L13,3.5 C13,2.67 12.33,2 11.5,2 C10.67,2 10,2.67 10,3.5 L10,9 L2,14 L2,16 L10,13.5 L10,19 L8,20.5 L8,22 L11.5,21 L15,22 L15,20.5 L13,19 L13,13.5 Z");

function getRouteColor(ratio) {
    if (ratio >= 0.85) return '#ff3b30'; // Rojo (Lleno)
    if (ratio >= 0.50) return '#ff9500'; // Naranjo (Intermedio)
    if (ratio > 0.25) return '#34c759'; // Verde (>10t)
    return '#8e8e93'; // Gris (Vacío / ~10t)
}

function slerp(lat1, lon1, lat2, lon2, f) {
    const R=Math.PI/180, p1=lat1*R, l1=lon1*R, p2=lat2*R, l2=lon2*R;
    const dp=p2-p1, dl=l2-l1;
    const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    if(c<1e-6) return [lon1,lat1];
    const A=Math.sin((1-f)*c)/Math.sin(c), B=Math.sin(f*c)/Math.sin(c);
    const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
    const y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
    const z=A*Math.sin(p1)+B*Math.sin(p2);
    return [Math.atan2(y,x)/R, Math.atan2(z,Math.sqrt(x*x+y*y))/R];
}

function getHeading(lat1, lon1, lat2, lon2, f) {
    const [a1, b1] = slerp(lat1, lon1, lat2, lon2, Math.max(0, f-0.001));
    const [a2, b2] = slerp(lat1, lon1, lat2, lon2, Math.min(1, f+0.001));
    const p1 = map.project([a1, b1]), p2 = map.project([a2, b2]);
    return Math.atan2(p2.y - p1.y, p2.x - p1.x);
}

function getProgress(v) {
    if(v.hora_salida <= v.hora_llegada) {
        if(t >= v.hora_salida && t <= v.hora_llegada) return (t-v.hora_salida)/(v.hora_llegada-v.hora_salida);
    } else {
        const dur = (168-v.hora_salida) + v.hora_llegada;
        if(t >= v.hora_salida) return (t-v.hora_salida)/dur;
        if(t <= v.hora_llegada) return (t+168-v.hora_salida)/dur;
    }
    return -1;
}

function isMatch(v, ratio) {
    const av = document.getElementById('f-avion').value;
    const op = document.getElementById('f-op').value;
    const rt = document.getElementById('f-ruta').value;
    const ori = document.getElementById('f-origen').value;
    const des = document.getElementById('f-destino').value;
    const cg = document.getElementById('f-carga').value;
    
    if (av !== 'ALL' && v.aeronave !== av) return false;
    if (op !== 'ALL' && v.operador !== op) return false;
    if (rt !== 'ALL' && `${v.origen}-${v.destino}` !== rt) return false;
    if (ori !== 'ALL' && v.origen !== ori) return false;
    if (des !== 'ALL' && v.destino !== des) return false;
    if (cg !== 'ALL') {
        if (cg === 'FULL' && ratio < 0.85) return false;
        if (cg === 'MED' && (ratio < 0.50 || ratio >= 0.85)) return false;
        if (cg === 'LIGHT' && (ratio <= 0.25 || ratio >= 0.50)) return false;
        if (cg === 'EMPTY' && ratio > 0.25) return false;
    }
    return true;
}

let currentVersion = 'actual';

let fetchedVersions = [];

async function fetchVersions() {
    try {
        const r = await fetch('/api/versions');
        if (r.ok) {
            fetchedVersions = await r.json();
            if(fetchedVersions.length > 0) {
                currentVersion = fetchedVersions[0].id;
                renderVersionsList();
            }
        }
    } catch(e) { console.warn('No versions API found'); }
}

function renderVersionsList() {
    const list = document.getElementById('versions-list');
    if (!list) return;
    list.innerHTML = ''; 
    fetchedVersions.forEach(v => {
        let displayName = v.id.replace('Ejecución con intervalos de', '');
        if (displayName === v.id) displayName = v.id;
        const isActive = (v.id === currentVersion);
        list.insertAdjacentHTML('beforeend', `<button class="version-option" data-id="${v.id}">${displayName.trim()} ${v.desc ? ' (' + v.desc + ')' : ''} <span style="font-weight:bold;">${isActive ? '✓' : ''}</span></button>`);
    });
    
    document.querySelectorAll('.version-option').forEach(btn => {
        btn.onclick = (e) => {
            currentVersion = e.currentTarget.dataset.id;
            document.getElementById('versions-popup').classList.remove('active');
            renderVersionsList();
            loadData(currentVersion);
        }
    });
}

async function loadData(version) {
    document.getElementById('loading').style.display = 'flex';
    let url = `../data/results/${encodeURIComponent(version)}/resultados.json?_t=` + new Date().getTime();
    if (version === 'visualizacion_actual.json' || version === 'actual') {
        url = `../data/results/visualizacion_actual.json?_t=` + new Date().getTime();
    }
    try { 
        const r = await fetch(url); 
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        D = await r.json(); 
    } 
    catch(e) { 
        console.error('Error cargando datos: ' + e.message); 
        document.getElementById('loading').style.display = 'none';
        return; 
    }

    payloadDict = Object.fromEntries(D.flota.map(a => [a.aircraft_id, a.payload_tons]));
    hayCostos = D.vuelos.some(v => v.costo_usd > 0);

    const oriSet = new Set(), desSet = new Set();
    apDict = {}; airportStats = {};
    D.aeropuertos.forEach(a => { apDict[a.iata] = a; airportStats[a.iata] = { out: 0, in: 0 }; });

    const ops = new Set(D.vuelos.map(v => v.operador));
    const rts = new Set(D.vuelos.map(v => `${v.origen}-${v.destino}`));
    const avs = new Set(D.vuelos.map(v => v.aeronave));
    
    D.vuelos.forEach(v => {
        oriSet.add(v.origen); desSet.add(v.destino);
        if(airportStats[v.origen]) airportStats[v.origen].out += v.carga_tons;
        if(airportStats[v.destino]) airportStats[v.destino].in += v.carga_tons;
    });

    ['f-avion','f-op','f-ruta','f-origen','f-destino'].forEach(id => {
        const el = document.getElementById(id);
        while(el.options.length > 1) el.remove(1);
    });

    const pop = (sel, set, mapFn = x=>x) => Array.from(set).sort().forEach(i => document.getElementById(sel).insertAdjacentHTML('beforeend', `<option value="${i}">${mapFn(i)}</option>`));
    pop('f-avion', avs); pop('f-op', ops); pop('f-ruta', rts, x => x.replace('-',' → ')); pop('f-origen', oriSet); pop('f-destino', desSet);

    document.getElementById('loading').style.display = 'none';
    if(map) render();
}

async function initMap() {
    await fetchVersions();
    // Use the fetched currentVersion or fallback to actual
    if (!currentVersion || currentVersion === 'actual') currentVersion = 'visualizacion_actual.json';
    
    // We can fallback loadData directly to the json if versions failed
    try {
        await loadData(currentVersion);
    } catch(e) {
        currentVersion = 'visualizacion_actual.json';
        await loadData(currentVersion);
    }

    map = new maplibregl.Map({ 
        container: 'map', 
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json', 
        center: [-60, 10], zoom: 2.5, pitch: 45, dragRotate: true,
        maxBounds: [[-140, -60], [60, 70]], // Limita a América, Europa y África
        renderWorldCopies: false,
        attributionControl: false
    });

    setupCanvas(); 
    setupUIEvents(); 
    updateTimeUI();
    
    setTimeout(() => { if(map) map.resize(); }, 600);
    requestAnimationFrame(loop);
    
    map.on('render', render); 
    map.on('move', render); 
    map.on('zoom', render);

    map.on('load', () => {
        try {
            map.setPaintProperty('background', 'background-color', '#e2efe6'); 
            map.setPaintProperty('water', 'fill-color', '#ffffff');
            map.setPaintProperty('boundary_country_inner', 'line-color', '#9eb0a4');
            map.setPaintProperty('boundary_country_inner', 'line-opacity', 0.8);
            map.setPaintProperty('boundary_country_outline', 'line-color', '#ffffff');
        } catch(e) { console.warn("No se pudo modificar la paleta", e); }
    });
}

function setupCanvas() {
    canvas = document.getElementById('canvas-layer'); ctx = canvas.getContext('2d');
    const resize = () => { 
        const rect = document.getElementById('map-section').getBoundingClientRect();
        canvas.width = rect.width; canvas.height = rect.height; render(); 
    };
    window.addEventListener('resize', resize); resize();
}

function render() {
    if(!ctx || !D || !map) return;
    
    // Check if map is ready for projection
    try { map.project([0,0]); } catch(e) { return; }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    window._drawnFlights = [];
    const fOp = document.getElementById('f-op').value;
    const fAv = document.getElementById('f-avion').value;
    const fRuta = document.getElementById('f-ruta').value;
    const showAllTraces = document.getElementById('f-all-traces').checked || fOp !== 'ALL' || fAv !== 'ALL' || fRuta !== 'ALL';

    D.rutas_catalogo.forEach(r => {
        const o = apDict[r.origen], d = apDict[r.destino];
        if(o && d) drawArc(o.lon, o.lat, d.lon, d.lat, 'rgba(0, 122, 255, 0.25)', 1.5, 20);
    });

    D.vuelos.forEach(v => {
        const cap = payloadDict[v.aeronave] || 50;
        const ratio = v.carga_tons / cap;
        if(!isMatch(v, ratio)) return;

        const p = getProgress(v);
        const o = apDict[v.origen], d = apDict[v.destino];
        if(!o || !d) return;

        const isColored = (fOp !== 'ALL' && v.operador === fOp);
        const routeColor = getRouteColor(ratio);
        const planeColor = routeColor;

        if (showAllTraces) {
            drawArc(o.lon, o.lat, d.lon, d.lat, routeColor, 2, 30);
        } else if (p >= 0) {
            drawTrail(o.lon, o.lat, d.lon, d.lat, p, routeColor);
        }

        if (p >= 0) {
            const [clon, clat] = slerp(o.lat, o.lon, d.lat, d.lon, p);
            const pt = map.project([clon, clat]);
            const angle = getHeading(o.lat, o.lon, d.lat, d.lon, p);

            ctx.save();
            ctx.translate(pt.x, pt.y);
            
            // Dibujar etiqueta de avión si el zoom es mayor a 3.0
            if (map.getZoom() >= 3.0) {
                const pct = Math.round(ratio * 100);
                const txt = `${v.aeronave} | ${v.origen}→${v.destino} | ${pct}%`;
                ctx.font = '700 10px Inter';
                const m = ctx.measureText(txt);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                
                // Fondo de la etiqueta
                ctx.beginPath();
                ctx.roundRect(14, -12, m.width + 10, 22, 4);
                ctx.fill();
                ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.stroke();
                
                // Texto
                ctx.fillStyle = '#1d1d1f';
                ctx.textAlign = 'left';
                ctx.fillText(txt, 19, 3);
            }

            ctx.rotate(angle + Math.PI/2);
            ctx.scale(0.85, 0.85);
            ctx.translate(-11.5, -12);
            
            ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = '#000';
            ctx.stroke(PLANE_PATH);
            
            ctx.fillStyle = planeColor;
            ctx.fill(PLANE_PATH);
            ctx.restore();

            window._drawnFlights.push({v, pt, p, ratio, isColored: true});
        }
    });

    D.aeropuertos.forEach(a => {
        const pt = map.project([a.lon, a.lat]);
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI*2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#007aff'; ctx.stroke();
        
        ctx.font = '700 10px Inter'; ctx.fillStyle = '#1d1d1f';
        ctx.textAlign = 'center'; ctx.fillText(a.iata, pt.x, pt.y - 8);

        if (map.getZoom() >= 4.5) {
            const stats = airportStats[a.iata];
            if (stats && (stats.in > 0 || stats.out > 0)) {
                ctx.font = '600 9px Inter';
                const txt = `In: ${Math.round(stats.in)}t | Out: ${Math.round(stats.out)}t`;
                const m = ctx.measureText(txt);
                
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath(); ctx.roundRect(pt.x - m.width/2 - 4, pt.y + 6, m.width + 8, 14, 3); ctx.fill();
                
                ctx.fillStyle = '#86868b';
                ctx.fillText(txt, pt.x, pt.y + 16);
            }
        }
    });
}

function drawArc(lon1, lat1, lon2, lat2, color, width, segs) {
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    for(let i=0; i<=segs; i++) {
        const [l, p] = slerp(lat1, lon1, lat2, lon2, i/segs);
        const pt = map.project([l, p]);
        i===0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
}

function drawTrail(lon1, lat1, lon2, lat2, p, color) {
    // Trazado recorrido (sólido)
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.setLineDash([]);
    for(let i=0; i<=Math.floor(p*30); i++) {
        const [l, pt_lat] = slerp(lat1, lon1, lat2, lon2, i/30);
        const pt = map.project([l, pt_lat]);
        i===0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
    }
    const [clon, clat] = slerp(lat1, lon1, lat2, lon2, p);
    const cpt = map.project([clon, clat]);
    ctx.lineTo(cpt.x, cpt.y);
    ctx.stroke();

    // Trazado futuro (punteado)
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]);
    ctx.moveTo(cpt.x, cpt.y);
    for(let i=Math.ceil(p*30); i<=30; i++) {
        const [l, pt_lat] = slerp(lat1, lon1, lat2, lon2, i/30);
        const pt = map.project([l, pt_lat]);
        ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1.0;
}

let payloadDict = {}, hayCostos = false;

function calcKPIs() {
    const k = { ing:0, cos:0, han:0, horas:0, ton:0, cap:0, comp:0, aire:0, usados:new Set() };
    airportStats = {};
    if (D && D.aeropuertos) {
        D.aeropuertos.forEach(a => airportStats[a.iata] = { in: 0, out: 0 });
    }

    for (const v of D.vuelos) {
        if (v.hora_salida > t) continue;
        const dur = v.hora_llegada - v.hora_salida;
        const frac = dur > 0 ? Math.min(1, (t - v.hora_salida) / dur) : 1;
        
        if (airportStats[v.origen]) airportStats[v.origen].out += v.carga_tons * frac;
        if (airportStats[v.destino]) airportStats[v.destino].in += v.carga_tons * frac;

        k.usados.add(v.aeronave);
        k.horas += dur * frac;
        k.ton += v.carga_tons * frac;
        k.cap += (payloadDict[v.aeronave] || 50) * frac;
        k.ing += (v.ingreso_usd || 0) * frac;
        k.cos += (v.costo_usd || 0) * frac;
        k.han += (v.handling_usd || 0) * frac;
        if (v.hora_llegada <= t) k.comp++; else k.aire++;
    }
    return k;
}

function updateKPIs() {
    if (!D) return;
    const k = calcKPIs(), T = D.kpis || {};
    const costos = k.cos + k.han, margen = k.ing - costos;
    const el = id => document.getElementById(id);
    ['kpi-margen-wrap','kpi-ing-wrap','kpi-cos-wrap'].forEach(id => el(id).style.display = hayCostos ? '' : 'none');
    if (hayCostos) {
        el('kpi-margen').textContent = FMT_USD(margen);
        el('kpi-margen').className = 'kpi-value ' + (margen >= 0 ? 'kpi-pos' : 'kpi-neg');
        el('kpi-ing').textContent = FMT_USD(k.ing);
        el('kpi-cos').textContent = FMT_USD(costos);
        if (T.margen_usd != null) el('kpi-margen-sub').textContent = 'Total semana: ' + FMT_USD(T.margen_usd);
        if (T.ingresos_usd != null) el('kpi-ing-sub').textContent = 'Total semana: ' + FMT_USD(T.ingresos_usd);
        if (T.costo_vuelos_usd != null) el('kpi-cos-sub').textContent = 'Total semana: ' + FMT_USD(T.costo_vuelos_usd + T.costo_handling_usd);
    }
    el('kpi-ocup').textContent = k.cap ? (100 * k.ton / k.cap).toFixed(1) + ' %' : '-';
    el('kpi-comp').textContent = `${k.comp} / ${D.vuelos.length}`;
    el('kpi-aire').textContent = `${k.aire} en el aire`;
    el('kpi-horas').textContent = k.horas.toFixed(0) + ' h';
    el('kpi-avs').textContent = `${k.usados.size} aviones usados`;
}

function loop(ts) {
    if(!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    if(playing) {
        t += (dt / 2000) * speed;
        if(t > 168) t = 0;
        updateTimeUI(); render();
    }
    lastTs = ts;
    requestAnimationFrame(loop);
}

function updateTimeUI() {
    document.getElementById('slider').value = t;
    const di = Math.min(Math.floor(t / 24), 6), h = Math.floor(t % 24), m = Math.floor((t % 1) * 60);
    document.getElementById('time-display').textContent = `${DIAS[di]} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    updateKPIs();
}

function setupUIEvents() {
    const bp = document.getElementById('btn-play');
    bp.onclick = () => { 
        playing = !playing; 
        bp.textContent = playing ? '⏸' : '▶'; 
        playing ? bp.classList.add('paused') : bp.classList.remove('paused');
    };
    
    const bs = document.getElementById('btn-speed');
    bs.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; bs.textContent = speed+'x'; };
    
    document.getElementById('slider').oninput = e => { t = parseFloat(e.target.value); updateTimeUI(); render(); };

    // Toggle ventana de filtros superior derecha
    document.getElementById('btn-toggle-filters').onclick = () => {
        const fp = document.getElementById('filters-popup');
        const active = fp.classList.contains('active');
        document.querySelectorAll('.filters-popup').forEach(p => p.classList.remove('active'));
        if (!active) fp.classList.add('active');
    };

    ['f-avion', 'f-op', 'f-ruta', 'f-origen', 'f-destino', 'f-carga'].forEach(id => {
        document.getElementById(id).onchange = render;
    });
    
    document.getElementById('f-all-traces').onchange = render;

    document.getElementById('btn-toggle-data').onclick = () => {
        const vp = document.getElementById('versions-popup');
        const active = vp.classList.contains('active');
        document.querySelectorAll('.filters-popup').forEach(p => p.classList.remove('active'));
        if (!active) vp.classList.add('active');
    };

    document.getElementById('btn-clear-filters').onclick = () => {
        ['f-avion', 'f-op', 'f-ruta', 'f-origen', 'f-destino', 'f-carga'].forEach(id => document.getElementById(id).value = 'ALL');
        document.getElementById('f-all-traces').checked = false;
        render();
    };




}

// Iniciar mapa automáticamente al cargar
window.onload = initMap;
</script>
